name: CD

on:
    push:
        branches: [ main ] # Only deploy from main

jobs:
    build-and-push:
        name: Build & Push Image
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        outputs:
            image-tag: ${{ steps.meta.outputs.tags }}
            image-digest: ${{ steps.build.outputs.digest }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=sha,prefix=sha-        # ghcr.io/user/repo:sha-abc1234
                      type=raw,value=latest       # ghcr.io/user/repo:latest

            - name: Build and push image
              id: build
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64,linux/arm64

            - name: Output image digest
              run: |
                  echo "Image digest: ${{ steps.build.outputs.digest }}"
                  echo "Image tags: ${{ steps.meta.outputs.tags }}"

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: build-and-push
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Deploy to production
              run: |
                  echo "🚀 Deploying ${{ needs.build-and-push.outputs.image-tag }}"
                  echo "📦 Image digest: ${{ needs.build-and-push.outputs.image-digest }}"

                  # ── Swap this block for your cloud provider ──
                  #
                  # AWS ECS:
                  # aws ecs update-service \
                  #   --cluster production \
                  #   --service multitenant-api \
                  #   --force-new-deployment
                  #
                  # Railway / Render:
                  # curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}
                  #
                  # Kubernetes (Phase 3 of this guide):
                  # kubectl set image deployment/saas-api \
                  #   api=ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
                  #
                  echo "✅ Deploy complete"

            - name: Notify on success
              if: success()
              run: |
                  echo "✅ Deployment successful"
                  echo "Commit: ${{ github.sha }}"
                  echo "Branch: ${{ github.ref_name }}"
                  echo "Actor: ${{ github.actor }}"

            - name: Notify on failure
              if: failure()
              run: |
                  echo "❌ Deployment failed"
                  # In production: post to Slack, PagerDuty, etc.
