name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-type

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: saas_pass
          POSTGRES_DB: saas_test_db
        ports:
          - 5432:5432
        # Wait until Postgres is actually ready
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://saas_user:saas_pass@localhost:5432/saas_test_db
      JWT_SECRET: cFdttPqchW2FreP6KIXZhQ/PdQAuJXB6KQBuQKy8Org=
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: a9TOeOWgikoQHXEp1jLHtpGL8JlNvrYKUrQAiqVtddY=
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit + integration tests
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Run E2E tests
        run: npm run test:e2e
